<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830"
     font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC','Source Han Sans SC',sans-serif">

  <defs>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#e3e8ee"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#c8d0da" stroke-width="2.2"/>
    </pattern>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M10,0 L10,10 L0,5 z" fill="#39424e"/>
    </marker>
  </defs>

  <rect width="1280" height="830" fill="#ffffff"/>

  <!-- ============ 标题 ============ -->
  <text x="48" y="50" font-size="25" font-weight="700" fill="#1b2430">
    LAB3 接手时的晶圆截面（示意，非等比）
  </text>
  <text x="48" y="78" font-size="14" fill="#5b6673">
    FDSOI 片 · 栅叠层（栅氧 / TiN / p⁺ poly / SiO₂ 硬掩模）已全部沉积完成，只等 Lab3 的光刻 + RIE 图形化
  </text>

  <!-- ============ 区域标签（画在图形上方） ============ -->
  <g font-size="12.5" fill="#39424e" text-anchor="middle" font-weight="600">
    <text x="180" y="192">场区（隔离）</text>
    <text x="410" y="192">NFET 有源区</text>
    <text x="580" y="192">场区（隔离）</text>
    <text x="750" y="192">PFET 有源区</text>
  </g>
  <g stroke="#98a3b0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="180" y1="198" x2="180" y2="233"/>
    <line x1="410" y1="198" x2="410" y2="215"/>
    <line x1="580" y1="198" x2="580" y2="233"/>
    <line x1="750" y1="198" x2="750" y2="207"/>
  </g>

  <!-- ============ 衬底 Si ============ -->
  <rect x="60" y="370" width="860" height="105" fill="url(#hatch)" stroke="#9aa4b0" stroke-width="1"/>
  <rect x="60" y="414" width="860" height="17" fill="#ffffff"/>
  <line x1="60" y1="414" x2="920" y2="414" stroke="#9aa4b0" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="60" y1="431" x2="920" y2="431" stroke="#9aa4b0" stroke-width="1" stroke-dasharray="6 4"/>
  <g stroke="#9aa4b0" stroke-width="1.4">
    <line x1="150" y1="422" x2="162" y2="410"/>
    <line x1="330" y1="422" x2="342" y2="410"/>
    <line x1="510" y1="422" x2="522" y2="410"/>
    <line x1="690" y1="422" x2="702" y2="410"/>
    <line x1="860" y1="422" x2="872" y2="410"/>
  </g>
  <text x="86" y="462" font-size="13" fill="#3d4652" font-weight="600">725 µm 衬底 Si（p 1×10¹⁵，截断）</text>

  <!-- ============ BOX ============ -->
  <rect x="60" y="300" width="860" height="70" fill="#5fb6dd" stroke="#3d9ec4" stroke-width="1"/>
  <text x="86" y="340" font-size="13.5" fill="#ffffff" font-weight="600">145 nm BOX（非晶 SiO₂）</text>

  <!-- ============ Si 岛（有源区，LAB2 已刻好） ============ -->
  <rect x="300" y="282" width="220" height="18" fill="#f5c542" stroke="#c99b1e" stroke-width="1"/>
  <text x="410" y="295" font-size="10" fill="#5a4200" text-anchor="middle">Si 20 nm（p 1×10¹⁵）</text>

  <rect x="640" y="282" width="220" height="18" fill="#f5c542" stroke="#c99b1e" stroke-width="1"/>
  <text x="750" y="295" font-size="10" fill="#5a4200" text-anchor="middle">Si 20 nm（p 1×10¹⁵）</text>

  <!-- ============ 栅氧（薄，包住岛的顶面与侧壁） ============ -->
  <path d="M60,296 L300,296 L300,278 L520,278 L520,296 L640,296 L640,278 L860,278 L860,296 L920,296
           L920,300 L860,300 L860,282 L640,282 L640,300 L520,300 L520,282 L300,282 L300,300 L60,300 Z"
        fill="#e8f7fc" stroke="#7fbcd3" stroke-width="0.9"/>

  <!-- ============ TiN（仅 PFET） ============ -->
  <rect x="640" y="270" width="220" height="8" fill="#4c9a4f" stroke="#3a7a3d" stroke-width="0.9"/>

  <!-- ============ p+ poly-Si（全片） ============ -->
  <path d="M60,250 L300,250 L300,232 L520,232 L520,250 L640,250 L640,224 L860,224 L860,250 L920,250
           L920,296 L860,296 L860,270 L640,270 L640,296 L520,296 L520,278 L300,278 L300,296 L60,296 Z"
        fill="#e23b3b" stroke="#b02a2a" stroke-width="1"/>

  <!-- ============ SiO2 硬掩模（全片，最上） ============ -->
  <path d="M60,236 L300,236 L300,218 L520,218 L520,236 L640,236 L640,210 L860,210 L860,236 L920,236
           L920,250 L860,250 L860,224 L640,224 L640,250 L520,250 L520,232 L300,232 L300,250 L60,250 Z"
        fill="#a9dcef" stroke="#6bb9d6" stroke-width="1"/>

  <!-- ============ TiN 标注 ============ -->
  <rect x="536" y="262" width="96" height="22" rx="5" fill="#ffffff" fill-opacity="0.94" stroke="#cfd6de" stroke-width="1"/>
  <text x="584" y="277" font-size="11" fill="#2f6b33" text-anchor="middle" font-weight="600">TiN 仅 PFET</text>
  <line x1="632" y1="273" x2="638" y2="273" stroke="#2f6b33" stroke-width="1.6"/>

  <!-- ============ 毯式覆盖标注 ============ -->
  <rect x="690" y="120" width="240" height="24" rx="5" fill="#fff7e6" stroke="#e0c181" stroke-width="1"/>
  <text x="810" y="136" font-size="11.5" fill="#7a5a10" text-anchor="middle" font-weight="600">
    全片覆盖的“毯子” → 看不到岛
  </text>
  <line x1="810" y1="144" x2="810" y2="204" stroke="#c9a44a" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ============ 表面台阶标注 ============ -->
  <rect x="140" y="120" width="280" height="24" rx="5" fill="#eef4ff" stroke="#a9c2e8" stroke-width="1"/>
  <text x="280" y="136" font-size="11.5" fill="#2c4a7a" text-anchor="middle" font-weight="600">
    表面台阶 = 20 nm（对焦的麻烦）
  </text>
  <line x1="300" y1="144" x2="300" y2="214" stroke="#7fa6d8" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- 叠层厚度手册未给，故不画尺寸线，避免误导；见下方注释 -->

  <!-- ============ 图例表 ============ -->
  <g>
    <rect x="948" y="196" width="296" height="332" rx="8" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1"/>
    <text x="964" y="219" font-size="12.5" font-weight="700" fill="#1b2430">层（自上而下）</text>

    <!-- row 1 -->
    <rect x="964" y="232" width="26" height="13" rx="2" fill="#a9dcef" stroke="#6bb9d6" stroke-width="0.9"/>
    <text x="1000" y="243" font-size="11.5" fill="#1b2430" font-weight="600">SiO₂ 硬掩模（PECVD）</text>
    <text x="1000" y="257" font-size="10.5" fill="#6b7684">全片；RIE 时充当掩模</text>

    <rect x="964" y="272" width="26" height="13" rx="2" fill="#e23b3b" stroke="#b02a2a" stroke-width="0.9"/>
    <text x="1000" y="283" font-size="11.5" fill="#1b2430" font-weight="600">p⁺ poly-Si，1×10²⁰ cm⁻³</text>
    <text x="1000" y="297" font-size="10.5" fill="#6b7684">全片；栅电极主体</text>

    <rect x="964" y="312" width="26" height="13" rx="2" fill="#4c9a4f" stroke="#3a7a3d" stroke-width="0.9"/>
    <text x="1000" y="323" font-size="11.5" fill="#1b2430" font-weight="600">TiN</text>
    <text x="1000" y="337" font-size="10.5" fill="#6b7684">仅 PFET 区（已预先图形化）</text>

    <rect x="964" y="352" width="26" height="13" rx="2" fill="#e8f7fc" stroke="#7fbcd3" stroke-width="0.9"/>
    <text x="1000" y="363" font-size="11.5" fill="#1b2430" font-weight="600">栅氧 SiO₂</text>
    <text x="1000" y="377" font-size="10.5" fill="#6b7684">很薄；包住岛的顶面与侧壁</text>

    <rect x="964" y="392" width="26" height="13" rx="2" fill="#f5c542" stroke="#c99b1e" stroke-width="0.9"/>
    <text x="1000" y="403" font-size="11.5" fill="#1b2430" font-weight="600">单晶 Si，20 nm，p 1×10¹⁵</text>
    <text x="1000" y="417" font-size="10.5" fill="#6b7684">LAB2 已刻成"岛"（台面隔离）</text>

    <rect x="964" y="432" width="26" height="13" rx="2" fill="#5fb6dd" stroke="#3d9ec4" stroke-width="0.9"/>
    <text x="1000" y="443" font-size="11.5" fill="#1b2430" font-weight="600">BOX，145 nm（非晶 SiO₂）</text>
    <text x="1000" y="457" font-size="10.5" fill="#6b7684">出厂自带</text>

    <rect x="964" y="472" width="26" height="13" rx="2" fill="url(#hatch)" stroke="#9aa4b0" stroke-width="0.9"/>
    <text x="1000" y="483" font-size="11.5" fill="#1b2430" font-weight="600">衬底 Si，725 µm，p 1×10¹⁵</text>
    <text x="1000" y="497" font-size="10.5" fill="#6b7684">机械支撑，不参与器件</text>
  </g>

  <!-- ============ 注释 ============ -->
  <line x1="60" y1="536" x2="1244" y2="536" stroke="#e2e7ee" stroke-width="1"/>

  <g font-size="11.8" fill="#3a4552">
    <g>
      <circle cx="66" cy="558" r="2.4" fill="#8d99a8"/>
      <text x="78" y="562">非等比：20 nm / 145 nm 大致按比例，725 µm 已截断。</text>

      <circle cx="66" cy="586" r="2.4" fill="#8d99a8"/>
      <text x="78" y="590">三种蓝色化学上都是 SiO₂（栅氧 / 硬掩模 / BOX），只用深浅区分层次。</text>

      <circle cx="66" cy="614" r="2.4" fill="#8d99a8"/>
      <text x="78" y="618">场区表面看不到 Si：叠层像"毯子"盖全片，岛的边界只表现为 20 nm 的表面台阶。</text>

      <circle cx="66" cy="642" r="2.4" fill="#8d99a8"/>
      <text x="78" y="646">TiN 只在 PFET；NFET 的 poly 直接压在栅氧上 → 两区叠层高度不同，过刻量不同。</text>
    </g>

    <g>
      <circle cx="656" cy="558" r="2.4" fill="#8d99a8"/>
      <text x="668" y="562">源漏尚未注入：岛内均匀 p 型 1×10¹⁵，N⁺/P⁺ 要到 LAB4 才出现。</text>

      <circle cx="656" cy="586" r="2.4" fill="#8d99a8"/>
      <text x="668" y="590">栅氧画为连续覆盖全表面（沉积氧化层）；若改用热氧化，则只长在裸 Si 上。</text>

      <circle cx="656" cy="614" r="2.4" fill="#8d99a8"/>
      <text x="668" y="618">对准标记（LAB1）在划片道，被叠层覆盖，本图未画。</text>

      <circle cx="656" cy="642" r="2.4" fill="#8d99a8"/>
      <text x="668" y="646">硬掩模 / poly / TiN / 栅氧 的厚度手册未给；它们决定主刻时间与过刻余量。</text>
    </g>
  </g>

  <text x="60" y="700" font-size="10.5" fill="#8d99a8">
    依据：L02 p.6（起点材料）、L02 p.9–p.10（NFET / PFET 栅叠层截面）、LAB instruction（8 步流程）；未标注厚度一律以实验手册为准。
  </text>

  <!-- ============ 图例：LAB3 之后 ============ -->
  <g>
    <rect x="60" y="716" width="1184" height="92" rx="8" fill="#f4f7fb" stroke="#dde3ea" stroke-width="1"/>
    <text x="84" y="742" font-size="12.5" font-weight="700" fill="#1b2430">Lab3 要做的事（把上图"切开"）</text>
    <text x="84" y="766" font-size="11.5" fill="#3a4552">
      ① 光刻：在硬掩模上定义栅条 → ② RIE 依次刻穿 SiO₂ 硬掩模（F 化学）、p⁺ poly（Cl/Br）、TiN（Cl₂/BCl₃），
    </text>
    <text x="84" y="788" font-size="11.5" fill="#3a4552">
      最后停在栅氧上（目标选择比 &gt; 100:1）。刻蚀完成后，栅氧只在栅条下方保留，其余场区暴露 BOX。
    </text>
  </g>

</svg>
